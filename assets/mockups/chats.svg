    <text x="84" y="124" font-size="15" fill="#111">أم حسين</text>
    <text x="84" y="144" font-size="13" fill="#666">مرحبا، هل وصلت الرسالة؟</text>
    <text x="320" y="122" font-size="12" fill="#999" text-anchor="end">الآن</text>
    <rect x="292" y="132" width="28" height="22" rx="11" fill="#FF3B30"/>
    <text x="306" y="148" font-size="12" fill="#fff" text-anchor="middle">2</text>
  </g>

  <g>
