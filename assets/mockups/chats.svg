<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <rect width="100%" height="100%" fill="#F7F7F8" rx="24"/>
  <!-- Header -->
  <rect x="0" y="0" width="360" height="76" fill="#fff"/>
  <text x="180" y="48" font-size="20" font-family="Arial, Noto Sans, sans-serif" text-anchor="middle">💬 المحادثات</text>

  <!-- List -->
  <g>
    <rect x="16" y="96" width="328" height="76" rx="12" fill="#fff" stroke="#EEE"/>
