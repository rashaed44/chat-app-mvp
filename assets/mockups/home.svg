<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <rect width="100%" height="100%" fill="#F7F7F8" rx="24"/>
  <!-- Header -->
  <rect x="0" y="0" width="360" height="76" fill="#fff"/>
  <text x="180" y="48" font-size="20" font-family="Arial, Noto Sans, sans-serif" text-anchor="middle">🏠 الرئيسية</text>

  <!-- Quick cards -->
  <rect x="16" y="96" width="328" height="90" rx="12" fill="#fff" stroke="#EFEFEF"/>
  <text x="32" y="128" font-size="14" fill="#333">آخر المحادثات</text>
  <text x="32" y="150" font-size="12" fill="#666">عرض سريع للمحادثات النشطة والإشعارات</text>

  <rect x="16" y="200" width="328" height="90" rx="12" fill="#fff" stroke="#EFEFEF"/>
  <text x="32" y="232" font-size="14" fill="#333">أصدقاء مقترحون</text>
  <text x="32" y="254" font-size="12" fill="#666">دعوة أو بدء محادثة</text>

  <!-- Chats preview -->
  <text x="24" y="320" font-size="16" fill="#111">المحادثات الأخيرة</text>
  <g>
    <rect x="16" y="340" width="328" height="66" rx="10" fill="#fff" stroke="#EEE"/>
    <circle cx="44" cy="373" r="20" fill="#DDD"/>
    <text x="80" y="362" font-size="14" fill="#111">أم حسين</text>
    <text x="80" y="382" font-size="12" fill="#666">كيف الحال؟</text>
    <text x="320" y="360" font-size="11" fill="#999" text-anchor="end">الآن</text>
  </g>

  <g>
    <rect x="16" y="418" width="328" height="66" rx="10" fill="#fff" stroke="#EEE"/>
    <circle cx="44" cy="451" r="20" fill="#DDD"/>
    <text x="80" y="440" font-size="14" fill="#111">مشروع الفريق</text>
    <text x="80" y="460" font-size="12" fill="#666">تم رفع النسخة الجديدة</text>
    <text x="320" y="438" font-size="11" fill="#999" text-anchor="end">1 س</text>
  </g>

  <!-- Bottom Tabs -->
  <rect x="0" y="700" width="360" height="80" fill="#fff"/>
  <text x="36" y="742" font-size="18" text-anchor="middle">🏠</text>
  <text x="108" y="742" font-size="18" text-anchor="middle">💬</text>
  <text x="180" y="742" font-size="18" text-anchor="middle">❤️</text>
  <text x="252" y="742" font-size="18" text-anchor="middle">🔔</text>
  <text x="324" y="742" font-size="18" text-anchor="middle">👤</text>
</svg>
